const LESSONS={"01.1": ["الگوریتم چیست؟", "الگوریتم دستورالعملی دقیق، پایان‌پذیر و دارای ترتیب مشخص برای تبدیل ورودی به خروجی است. پیش از نوشتن کد باید مسئله، ورودی، محدودیت‌ها و خروجی را روشن کنیم.", "مسئله: محاسبه میانگین سه نمره. ابتدا سه نمره را دریافت کن، مجموع را محاسبه کن، آن را بر ۳ تقسیم کن و نتیجه را نمایش بده.", "scores = [15, 18, 12]\ntotal = sum(scores)\naverage = total / len(scores)\nprint(average)", "15.0", "خط اول داده‌ها را آماده می‌کند. خط دوم مجموع را می‌سازد. خط سوم تعداد نمره‌ها را از طول لیست به دست می‌آورد و میانگین را حساب می‌کند. خط آخر نتیجه را چاپ می‌کند.", "پیش از کدنویسی، بررسی کن اگر لیست خالی باشد چه اتفاقی می‌افتد. الگوریتم خوب باید حالت‌های مرزی را هم در نظر بگیرد."], "02.1": ["تورفتگی و محدوده بلوک‌ها", "در پایتون تورفتگی فقط برای زیبایی نیست؛ تعیین می‌کند کدام دستور داخل شرط، حلقه یا تابع قرار دارد. معمولاً از چهار فاصله برای هر سطح استفاده می‌کنیم.", "در مثال زیر پیام دوم فقط برای افراد بزرگسال چاپ می‌شود، ولی پیام آخر برای همه چاپ خواهد شد.", "age = 20\nif age >= 18:\n    print(\"Adult\")\n    print(\"Can register\")\nprint(\"Finished\")", "Adult\nCan register\nFinished", "دو خط print اول چهار فاصله تورفتگی دارند و عضو بدنه if هستند. print آخر بدون تورفتگی است؛ بنابراین بیرون شرط قرار دارد.", "هرگز Tab و Space را در یک بلوک مخلوط نکن. برای فهم محدوده بلوک، یک خط عمودی فرضی کنار دستورهای هم‌سطح بکش."], "02.2": ["متغیر چیست؟", "متغیر نامی است که به یک شیء یا مقدار در حافظه اشاره می‌کند. علامت = در پایتون «انتساب» است، نه آزمون برابری.", "در مثال، مقدار اولیه متغیر تغییر می‌کند و مقدار جدید چاپ می‌شود.", "price = 100\nprice = price + 20\nprint(price)", "120", "ابتدا نام price به عدد ۱۰۰ ارجاع دارد. سپس عبارت سمت راست محاسبه می‌شود و نتیجه ۱۲۰ به price نسبت داده می‌شود.", "برای آزمون برابری از == استفاده کن، نه =."], "04.1": ["شرط‌ها: if، elif و else", "شرط‌ها مسیر اجرای برنامه را بر اساس نتیجه یک عبارت بولی انتخاب می‌کنند. پایتون شرط‌ها را از بالا به پایین می‌سنجد و تنها نخستین شاخه درست را اجرا می‌کند.", "برنامه نمره را در سه دسته طبقه‌بندی می‌کند.", "score = 75\nif score >= 90:\n    print(\"Excellent\")\nelif score >= 50:\n    print(\"Pass\")\nelse:\n    print(\"Fail\")", "Pass", "چون ۷۵ از ۹۰ کمتر است، بدنه if اجرا نمی‌شود. شرط elif درست است، پس Pass چاپ می‌شود و else دیگر بررسی نمی‌شود.", "ترتیب شرط‌ها مهم است. اگر شرط عمومی‌تر را زودتر بنویسی، ممکن است شاخه دقیق‌تر هرگز اجرا نشود."], "04.2": ["حلقه for", "حلقه for برای پیمایش اعضای یک مجموعه یا هر شیء قابل پیمایش به کار می‌رود. بدنه حلقه در هر دور برای یک عضو اجرا می‌شود.", "هر قیمت را جداگانه نمایش می‌دهیم و در پایان مجموع را چاپ می‌کنیم.", "prices = [10, 20, 30]\ntotal = 0\nfor price in prices:\n    print(price)\n    total += price\nprint(\"Total:\", total)", "10\n20\n30\nTotal: 60", "دستورهای داخل حلقه چهار فاصله تورفتگی دارند و سه بار اجرا می‌شوند. دستور آخر بیرون حلقه است و فقط یک بار اجرا می‌شود.", "اگر print آخر را یک سطح داخل حلقه ببری، مجموع در هر تکرار چاپ می‌شود؛ این تفاوت محدوده اجراست."], "04.3": ["حلقه while", "while تا زمانی که شرط درست باشد، بدنه خود را تکرار می‌کند. باید مطمئن شوی متغیرهای مؤثر بر شرط به‌روزرسانی می‌شوند تا حلقه ناخواسته بی‌پایان نشود.", "شمارنده از صفر تا دو نمایش داده می‌شود.", "count = 0\nwhile count < 3:\n    print(count)\n    count += 1\nprint(\"Done\")", "0\n1\n2\nDone", "تا زمانی که count کمتر از ۳ است، دو خط داخل حلقه اجرا می‌شوند. با رسیدن شمارنده به ۳، اجرای حلقه متوقف و Done یک بار چاپ می‌شود.", "اگر count += 1 را فراموش کنی، شرط همیشه درست می‌ماند."], "05.1": ["لیست", "لیست مجموعه‌ای مرتب و تغییرپذیر از داده‌هاست. اندیس اولین عضو صفر است و می‌توان عضو جدید افزود یا اعضا را تغییر داد.", "افزودن یک عضو و محاسبه تعداد اعضا.", "names = [\"Sara\", \"Ali\"]\nnames.append(\"Mina\")\nprint(names[0])\nprint(len(names))", "Sara\n3", "append عضو جدید را به انتهای لیست اضافه می‌کند. names[0] اولین عضو را می‌دهد و len تعداد اعضا را برمی‌گرداند.", "دسترسی به اندیسی خارج از محدوده، IndexError ایجاد می‌کند."], "05.4": ["دیکشنری", "دیکشنری ساختاری از جفت‌های کلید و مقدار است. برای جست‌وجوی سریع اطلاعات با یک کلید معنادار بسیار مناسب است.", "موجودی کالا را بررسی و به‌روزرسانی می‌کنیم.", "stock = {\"pen\": 12, \"book\": 5}\nstock[\"pen\"] -= 2\nprint(stock[\"pen\"])\nprint(stock.get(\"eraser\", 0))", "10\n0", "در خط دوم دو قلم از موجودی کم می‌شود. get برای کلید ناموجود، به‌جای خطا مقدار پیش‌فرض صفر برمی‌گرداند.", "برای کلید ناموجود، stock[\"eraser\"] خطای KeyError می‌دهد؛ در موارد اختیاری از get استفاده کن."], "06.1": ["تعریف تابع", "تابع مجموعه‌ای از دستورها با نام مشخص است که هنگام فراخوانی اجرا می‌شود. تابع باعث کاهش تکرار و آسان‌ترشدن تست و نگهداری کد می‌شود.", "تابعی برای محاسبه قیمت پس از تخفیف می‌سازیم.", "def discounted(price, percent):\n    amount = price * percent / 100\n    return price - amount\n\nresult = discounted(200, 10)\nprint(result)", "180.0", "دو خط تورفته داخل تابع هستند. return مقدار را به محل فراخوانی بازمی‌گرداند. دستورهای بیرون تابع نتیجه را دریافت و چاپ می‌کنند.", "تعریف تابع به‌تنهایی بدنه آن را اجرا نمی‌کند؛ باید تابع را فراخوانی کنی."], "06.3": ["return و تفاوت آن با print", "return نتیجه را از تابع به محل فراخوانی می‌فرستد و اجرای تابع را پایان می‌دهد. print فقط متن را در خروجی نمایش می‌دهد و جایگزین return نیست.", "نتیجه تابع را در متغیر می‌گیریم و در محاسبه دیگری به کار می‌بریم.", "def add(a, b):\n    return a + b\n\nresult = add(3, 4)\nprint(result * 2)", "14", "add مقدار ۷ را بازمی‌گرداند؛ result برابر ۷ می‌شود و در خط آخر در ۲ ضرب می‌شود.", "اگر داخل تابع فقط print(a + b) بنویسی، نتیجه پیش‌فرض تابع None خواهد بود."], "10.1": ["try و except", "برای مدیریت خطاهای قابل انتظار از try و except استفاده می‌کنیم. تنها بخش حساس را داخل try قرار بده و خطای مشخص را بگیر.", "ورودی نامعتبر را به پیام قابل فهم تبدیل می‌کنیم.", "text = \"abc\"\ntry:\n    number = int(text)\n    print(number)\nexcept ValueError:\n    print(\"Invalid number\")", "Invalid number", "تبدیل abc به عدد صحیح ValueError ایجاد می‌کند. اجرا به except می‌رود و پیام مناسب چاپ می‌شود.", "از except: بدون تعیین نوع خطا پرهیز کن؛ ممکن است خطاهای مهم را پنهان کند."], "12.2": ["Generator و yield", "ژنراتور مقادیر را در زمان نیاز تولید می‌کند، نه اینکه لزوماً همه را یک‌جا در حافظه بسازد. دستور yield یک مقدار می‌دهد و وضعیت تابع را برای ادامه بعدی نگه می‌دارد.", "شمارش معکوس با ژنراتور.", "def countdown(n):\n    while n > 0:\n        yield n\n        n -= 1\n\nfor number in countdown(3):\n    print(number)", "3\n2\n1", "در هر درخواست حلقه for، تابع تا yield بعدی اجرا می‌شود. پس از دریافت مقدار، اجرا از همان نقطه ادامه پیدا می‌کند.", "return معمولاً تابع را تمام می‌کند، اما yield اجازه می‌دهد تابع در چند مرحله مقدار تولید کند."], "13.1": ["ماژول math", "math مجموعه‌ای از توابع و ثابت‌های ریاضی مانند sqrt، floor، ceil و pi است و همراه پایتون ارائه می‌شود.", "محاسبه ریشه دوم و گردکردن به بالا.", "import math\nprint(math.sqrt(81))\nprint(math.ceil(7.2))", "9.0\n8", "با import math به امکانات ماژول دسترسی پیدا می‌کنیم. sqrt ریشه دوم و ceil کوچک‌ترین عدد صحیح بزرگ‌تر یا مساوی مقدار را می‌دهد.", "برای فراخوانی math.sqrt ابتدا باید math را وارد کرده باشی."], "14.4": ["venv و pip", "محیط مجازی وابستگی‌های هر پروژه را از پروژه‌های دیگر جدا می‌کند. pip ابزار نصب بسته‌های پایتونی است.", "در ترمینال، محیط مجازی بساز و بسته موردنیاز را نصب کن.", "python -m venv .venv\npython -m pip install requests", "فرمان دوم در صورت دسترسی به اینترنت بسته را نصب می‌کند.", "این خطوط دستور ترمینال هستند، نه کد داخل فایل py. برای استفاده از محیط ساخته‌شده معمولاً باید آن را فعال کنی.", "محیط مجازی را به‌عنوان فایل‌های حجیم پروژه در Git ثبت نکن."]};
const KEY='python-encyclopedia-v2';
let state={};try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
for(const k of ['read','saved','expanded'])if(!Array.isArray(state[k]))state[k]=[];
let selected=location.hash.slice(1)||'01',search='',filter='all';
const byId={};for(const c of DATA){byId[c.id]={...c,chapter:c};for(const x of c.children)byId[x.id]={...x,chapter:c}}
const esc=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const matches=(x,q)=>[x.id,x.title,x.description,x.en,x.overview].some(t=>String(t||'').toLowerCase().includes(q));
function renderTree(){
 const tree=document.getElementById('tree');tree.innerHTML='';
 for(const c of DATA){
  const filtered=c.children.filter(x=>(!search||matches(x,search))&&(filter==='all'||state[filter].includes(x.id)));
  if((search&&!matches(c,search)&&!filtered.length)||(filter!=='all'&&!state[filter].includes(c.id)&&!filtered.length))continue;
  const div=document.createElement('div');div.className='chapter';
  const expanded=state.expanded.includes(c.id)||Boolean(search);
  const branch=document.createElement('button');branch.className='branch';branch.setAttribute('aria-expanded',String(expanded));
  branch.innerHTML=`<span>${expanded?'📂':'📁'} ${esc(c.id)}. ${esc(c.title)}</span><span class="arrow">${expanded?'⌃':'⌄'}</span>`;
  branch.onclick=()=>{state.expanded=state.expanded.includes(c.id)?state.expanded.filter(v=>v!==c.id):[...state.expanded,c.id];save();selected=c.id;history.replaceState(null,'','#'+c.id);renderContent();renderTree()};
  div.append(branch);
  if(expanded){for(const x of filtered){const leaf=document.createElement('button');leaf.className='leaf'+(selected===x.id?' selected':'');leaf.innerHTML=`<small>${esc(x.id)}</small> ${esc(x.title)} ${state.read.includes(x.id)?'✓':''}`;leaf.onclick=()=>select(x.id);div.append(leaf)}}
  tree.append(div);
 }
 if(!tree.children.length)tree.innerHTML='<p class="muted">نتیجه‌ای پیدا نشد.</p>';
}
function select(id){if(!byId[id])return;selected=id;history.replaceState(null,'','#'+id);renderContent();renderTree();}
function toggle(k,id){state[k]=state[k].includes(id)?state[k].filter(v=>v!==id):[...state[k],id];save();renderContent();renderTree()}
function renderContent(){
 const x=byId[selected]||byId['01'],c=x.chapter,isChapter=x.id===c.id;
 const actions=`<div class="actions"><button id="save" class="${state.saved.includes(x.id)?'on':''}">${state.saved.includes(x.id)?'★ نشان‌شده':'☆ نشان‌گذاری'}</button><button id="mark" class="${state.read.includes(x.id)?'on':''}">${state.read.includes(x.id)?'✓ مطالعه‌شده':'○ علامت مطالعه‌شده'}</button></div>`;
 const root=document.getElementById('content');
 if(isChapter){root.innerHTML=`<div class="crumb">فهرست اصلی / فصل ${esc(c.id)}</div><h2 class="heading">${esc(c.title)}</h2><div class="eng">${esc(c.en)}</div><div class="desc">${esc(c.overview)}</div>${actions}<h3>موضوعات این فصل</h3><div class="subtopics">${c.children.map(t=>`<button class="topic" data-id="${esc(t.id)}"><b>${esc(t.id)} — ${esc(t.title)}</b><p class="muted">${esc(t.description)}</p></button>`).join('')}</div>`;root.querySelectorAll('.topic').forEach(b=>b.onclick=()=>select(b.dataset.id));}
 else{
 const l=LESSONS[x.id];
 const body=l?`<section class="lesson"><h3>۱. تعریف و درک مفهوم</h3><p>${esc(l[1])}</p><h3>۲. مسئله و کاربرد</h3><p>${esc(l[2])}</p><h3>۳. نمونه کد با تورفتگی واضح</h3><div class="codehead"><span>Python</span><button id="copycode">کپی کد</button></div><pre class="codeview"><code>${l[3].split('\n').map((line,i)=>`<span class="codeline"><span class="lineno">${i+1}</span><span class="codetext">${esc(line).replace(/^((?: {4})+)/,m=>'<span class="indent">'+m.replace(/ {4}/g,'<i>····</i>')+'</span>')}</span></span>`).join('')}</code></pre><h3>۴. خروجی</h3><pre class="output"><code>${esc(l[4])}</code></pre><h3>۵. تشریح خط‌به‌خط</h3><p>${esc(l[5])}</p><h3>۶. نکته مهم و اشتباه رایج</h3><p>${esc(l[6])}</p></section>`:`<section class="lesson"><h3>تعریف</h3><p>${esc(x.description)}</p><div class="pending"><b>این درس هنوز تکمیل نشده است.</b><p>برای این موضوع، درس جامع با مثال، خروجی و تحلیل خط‌به‌خط در نسخه بعدی آماده می‌شود. به‌جای نمایش توضیح ساختگی یا تکراری، وضعیت آن شفاف مشخص شده است.</p></div></section>`;
 root.innerHTML=`<div class="crumb"><a href="#${esc(c.id)}" id="parent">${esc(c.id)}. ${esc(c.title)}</a> / ${esc(x.id)}</div><h2 class="heading">${esc(l?l[0]:x.title)}</h2><div class="desc">${esc(x.description)}</div>${actions}${body}`;
 root.querySelector('#parent').onclick=e=>{e.preventDefault();select(c.id)};
 if(l)root.querySelector('#copycode').onclick=()=>{const b=root.querySelector('#copycode');navigator.clipboard?.writeText(l[3]).then(()=>b.textContent='کپی شد').catch(()=>b.textContent='کپی ممکن نشد')};
 }
 root.querySelector('#save').onclick=()=>toggle('saved',x.id);root.querySelector('#mark').onclick=()=>toggle('read',x.id);
 document.getElementById('stats').textContent=`۳۰ فصل · ${DATA.reduce((n,c)=>n+c.children.length,0)} موضوع · ${Object.keys(LESSONS).length} درس تفصیلی · ${state.read.length} مورد مطالعه‌شده`;
}
document.getElementById('search').oninput=e=>{search=e.target.value.trim().toLowerCase();renderTree()};
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter==='all'?'all':b.dataset.filter==='saved'?'saved':'read';document.querySelectorAll('[data-filter]').forEach(a=>a.classList.toggle('active',a===b));renderTree()});
window.onhashchange=()=>{selected=location.hash.slice(1)||'01';renderContent();renderTree()};
renderContent();renderTree();
</script></body></html>
