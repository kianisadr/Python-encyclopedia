const STORE="python-encyclopedia-v1";
let state;try{state=JSON.parse(localStorage.getItem(STORE))||{}}catch(e){state={}}
state.saved=state.saved||[];state.read=state.read||[];state.expanded=state.expanded||["01"];
let selected=location.hash.slice(1)||"01",filter="all",query="";
const byId={};DATA.forEach(c=>{byId[c.id]={...c,chapter:c};c.children.forEach(x=>byId[x.id]={...x,chapter:c})});
const esc=s=>String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const persist=()=>{try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}};
const includes=(s,q)=>String(s||"").toLowerCase().includes(q);
function renderTree(){
const tree=document.getElementById("tree");tree.innerHTML="";
DATA.forEach(c=>{
let children=c.children.filter(x=>(!query||includes(x.id+" "+x.title+" "+x.description,query))&&(filter==="all"||(filter==="saved"?state.saved:state.read).includes(x.id)));
let show=(!query||includes(c.id+" "+c.title+" "+c.en+" "+c.overview,query)||children.length>0)&&(filter==="all"||children.length>0||(filter==="saved"?state.saved:state.read).includes(c.id));
if(!show)return;
let div=document.createElement("div");div.className="chapter";
let b=document.createElement("button");b.className="branch";b.innerHTML=`<span>📁 ${esc(c.id)}. ${esc(c.title)}</span><span class="arrow">${state.expanded.includes(c.id)||query?"⌄":"‹"}</span>`;
b.onclick=()=>{state.expanded=state.expanded.includes(c.id)?state.expanded.filter(x=>x!==c.id):[...state.expanded,c.id];persist();select(c.id,false);renderTree()};div.append(b);
if(state.expanded.includes(c.id)||query){
(c.children.filter(x=>(!query||includes(x.id+" "+x.title+" "+x.description,query))&&(filter==="all"||(filter==="saved"?state.saved:state.read).includes(x.id)))).forEach(x=>{
let leaf=document.createElement("button");leaf.className="leaf"+(selected===x.id?" selected":"");leaf.innerHTML=`<small>${esc(x.id)}</small> ${esc(x.title)} ${state.read.includes(x.id)?"✓":""} ${state.saved.includes(x.id)?"★":""}`;leaf.onclick=()=>select(x.id);div.append(leaf)});
}
tree.append(div);
});
if(!tree.children.length)tree.innerHTML='<p class="muted" style="padding:12px">موردی یافت نشد.</p>';
}
const EXAMPLES={

"04.1":["score = 75\\nif score >= 90:\\n    print('Excellent')\\nelif score >= 50:\\n    print('Pass')\\nelse:\\n    print('Fail')","شرط‌ها به ترتیب بررسی می‌شوند و نخستین شاخه درست اجرا می‌شود."],

"12.2":["def countdown(n):\\n    while n > 0:\\n        yield n\\n        n -= 1\\n\\nfor x in countdown(3):\\n    print(x)","Generator مقدارها را در زمان نیاز تولید می‌کند."],
"13.1":["import math\\nprint(math.sqrt(81))  # 9.0","کتابخانه استاندارد بدون نصب بسته جداگانه در دسترس است."],
"14.4":["python -m venv .venv\\npython -m pip install requests","فرمان‌ها در ترمینال اجرا می‌شوند، نه درون کد پایتون."]
};
function select(id,update=true){
if(!byId[id])id="01";selected=id;if(update)location.hash=id;
const x=byId[id],isChapter=id===x.chapter.id,c=x.chapter;
if(!state.expanded.includes(c.id))state.expanded.push(c.id);persist();
const content=document.getElementById("content");
let action=`<div class="actions"><button id="save" class="${state.saved.includes(id)?"on":""}">${state.saved.includes(id)?"★ حذف نشان":"☆ نشان‌گذاری"}</button><button id="mark" class="${state.read.includes(id)?"on":""}">${state.read.includes(id)?"✓ مطالعه شده":"○ علامت مطالعه‌شده"}</button></div>`;
if(isChapter){
content.innerHTML=`<div class="crumb">فهرست اصلی / فصل ${esc(c.id)}</div><h2 class="heading">${esc(c.title)}</h2><div class="eng">${esc(c.en)}</div><div class="desc">${esc(c.overview)}</div>${action}<h3>زیرشاخه‌های این فصل</h3><div class="subtopics">${c.children.map(t=>`<button class="topic" data-id="${esc(t.id)}"><b>${esc(t.id)} — ${esc(t.title)}</b><p class="muted">${esc(t.description)}</p></button>`).join("")}</div><p class="note">این نسخه یک نقشه مرجع قابل جست‌وجو با تعریف‌های اولیه است؛ شرح‌های عمیق‌تر هر موضوع به‌تدریج به نسخه‌های بعدی اضافه می‌شوند.</p>`;
content.querySelectorAll(".topic").forEach(b=>b.onclick=()=>select(b.dataset.id));
}else{
let example=EXAMPLES[id],sample=example?`<h3>مثال کاربردی</h3><pre><code>${esc(example[0])}</code></pre><p>${esc(example[1])}</p>`:"";
content.innerHTML=`<div class="crumb"><a href="#${esc(c.id)}" id="parent">${esc(c.id)}. ${esc(c.title)}</a> / ${esc(id)}</div><h2 class="heading">${esc(x.title)}</h2><div class="desc">${esc(x.description)}</div>${action}<h3>جایگاه در نقشه دانش</h3><p>این مفهوم بخشی از فصل «${esc(c.title)}» است. شناخت آن در کنار دیگر مباحث این فصل، به درک منسجم‌تر پایتون کمک می‌کند.</p>${sample}<h3>مطالعه بیشتر</h3><p>برای تکمیل این مبحث در نسخه‌های بعدی، بخش‌های «تعریف دقیق»، «نحو و جزئیات»، «مثال‌های بیشتر»، «خطاهای رایج» و «مقایسه با مفاهیم مرتبط» در نظر گرفته شده‌اند.</p><p class="note">شناسه ثابت مبحث: ${esc(id)} — می‌توانی با همین شناسه در گفت‌وگو درخواست توضیح مفصل بدهی.</p>`;
content.querySelector("#parent").onclick=e=>{e.preventDefault();select(c.id)};
}
content.querySelector("#save").onclick=()=>toggle("saved",id);
content.querySelector("#mark").onclick=()=>toggle("read",id);
renderTree();document.getElementById("stats").textContent=`۳۰ فصل · ${DATA.reduce((a,c)=>a+c.children.length,0)} موضوع · ${state.read.length} مورد مطالعه‌شده`;
}
function toggle(k,id){state[k]=state[k].includes(id)?state[k].filter(x=>x!==id):[...state[k],id];persist();select(id,false)}
document.getElementById("search").oninput=e=>{query=e.target.value.trim().toLowerCase();renderTree()};
document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===b));renderTree()});
window.onhashchange=()=>select(location.hash.slice(1),false);
select(selected,false);
</script></body></html>
